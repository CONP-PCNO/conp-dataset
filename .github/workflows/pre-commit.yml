name: Linting

on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-24
    steps:
      - name: Checkout repository (without submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - uses: pre-commit/action@v3
